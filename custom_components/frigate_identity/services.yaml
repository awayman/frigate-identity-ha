regenerate_dashboard:
  name: Regenerate dashboard
  description: Regenerate the Frigate Identity dashboard and related Lovelace resources.
get_registry_status:
  name: Get registry status
  description: Log the current person registry status to help diagnose dashboard issues.
set_debug_mode:
  name: Set debug mode
  description: Enable or disable debug logging in the Frigate Identity Service for troubleshooting misidentifications.
  fields:
    enabled:
      name: Enabled
      description: Enable or disable debug logging
      required: true
      selector:
        boolean:

clear_embeddings:
  name: Clear embeddings
  description: Clear all learned person embeddings in the Frigate Identity Service.
  fields:
    reason:
      name: Reason
      description: Optional note recorded by the service logs when clearing embeddings.
      required: false
      selector:
        text:

update_person_profile:
  name: Update person profile
  description: Mark a person as child/adult and set safe zones where a child can be unsupervised.
  fields:
    person_name:
      name: Person name
      description: Name of the person to configure.
      required: true
      selector:
        text:
    is_child:
      name: Is child
      description: Whether this person should be treated as a child for supervision logic.
      required: false
      selector:
        boolean:
    safe_zones:
      name: Safe zones
      description: List of zone names where this child can be alone.
      required: false
      selector:
        object:

update_child_safe_zones:
  name: Update child safe zones
  description: Backward-compatible alias for updating safe zones only.
  fields:
    person_name:
      name: Person name
      description: Name of the child to configure.
      required: true
      selector:
        text:
    safe_zones:
      name: Safe zones
      description: List of zone names where this child can be alone.
      required: false
      selector:
        object:

report_false_positive:
  name: Report false positive
  description: >
    Report a false-positive identification for a person. Publishes the latest
    event context to the identity service via MQTT; the service removes the
    associated embedding and publishes back a success or error notification.
  fields:
    person_id:
      name: Person ID
      description: Name of the person whose latest identification is a false positive.
      required: true
      selector:
        text:

configure_tracker_geofence:
  name: Configure tracker geofence
  description: >
    Send a polygon-based geofence configuration to a Meshtastic tracker device
    via the official Meshtastic Home Assistant integration. The tracker will
    monitor the configured zone locally and report its status back to HA.
  fields:
    tracker_id:
      name: Tracker ID
      description: Meshtastic device ID of the tracker (e.g. "1234").
      required: true
      selector:
        text:
    person_name:
      name: Person name
      description: Name of the person being tracked (must match a Frigate Identity person).
      required: true
      selector:
        text:
    polygon:
      name: Polygon
      description: >
        List of [latitude, longitude] coordinate pairs defining the geofence
        boundary (minimum 3 points). Example:
        [[40.7128, -74.0060], [40.7135, -74.0060], [40.7135, -74.0055]].
      required: true
      selector:
        object:
    geofence_name:
      name: Geofence name
      description: Optional friendly name for this geofence (e.g. "home_yard").
      required: false
      selector:
        text:
    relay_entity:
      name: Relay entity
      description: Optional HA switch entity ID for relay feedback (e.g. "switch.toy_relay").
      required: false
      selector:
        entity:
          domain: switch
    enable_beeper:
      name: Enable beeper
      description: Enable or disable the audible beeper on the tracker when outside the geofence.
      required: false
      selector:
        boolean:
    buzzer_gpio:
      name: Buzzer GPIO
      description: Optional GPIO pin for an external buzzer. Use 0 for the built-in Meshtastic buzzer API.
      required: false
      selector:
        number:
          min: 0
          max: 39
          mode: box
    warn_dist_approaching:
      name: Approaching distance
      description: Distance in metres for the outer beeper warning zone.
      required: false
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    warn_dist_near:
      name: Near distance
      description: Distance in metres for the medium beeper warning zone.
      required: false
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    warn_dist_critical:
      name: Critical distance
      description: Distance in metres for the innermost beeper warning zone.
      required: false
      selector:
        number:
          min: 1
          max: 1000
          mode: box